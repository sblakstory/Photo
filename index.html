<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffd329"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Seblak Story Photobooth</title><style>
:root{--y:#ffd329;--b:#171717;--bg:#fff9df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--b);font-family:system-ui,sans-serif}header{height:66px;background:var(--y);border-bottom:3px solid var(--b);display:grid;place-items:center}.brand{font-size:23px;font-weight:1000}.brand span{display:block;text-align:center;font-size:10px;letter-spacing:2px}main{width:min(100%,760px);margin:auto;padding:14px}button,select{font:inherit;font-weight:850;border:2px solid var(--b);border-radius:12px;padding:12px;background:white;color:var(--b)}button.primary{background:var(--y)}button.dark{background:var(--b);color:white}button:disabled{opacity:.4}#startCamera{width:100%;margin-bottom:9px}.camera{position:relative;aspect-ratio:4/3;background:#111;border:2px solid var(--b);border-radius:16px;overflow:hidden;display:grid;place-items:center}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#cameraHint{color:white;font-size:14px}#countdown{display:none;position:absolute;color:white;font-size:clamp(80px,20vw,150px);font-weight:1000;text-shadow:0 3px 15px #000}.settings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:850}select{width:100%;padding:10px}.actions{display:grid;grid-template-columns:1fr 58px;gap:8px}#capture{font-size:17px;padding:15px}#switchCamera{font-size:20px}#status{text-align:center;font-size:12px;font-weight:750;min-height:18px;margin:9px 0}#result{display:none;margin-top:14px}#strip{display:block;width:min(100%,300px);height:auto;margin:auto;background:white;border:1px solid #ddd}.resultActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.resultActions button{padding:11px 4px;font-size:13px}@media(min-width:650px){main{padding:20px}}@media print{body{background:white}header,#startCamera,.settings,.actions,#status,.resultActions{display:none!important}main{padding:0}.camera{display:none}#result{display:block!important}#strip{width:58mm;max-width:100%;border:0}}
</style></head><body><header><div class="brand">SEBLAK STORY<span>PHOTOBOOTH</span></div></header><main><button class="primary" id="startCamera">AKTIFKAN KAMERA</button><div class="camera"><video id="video" autoplay playsinline muted></video><div id="cameraHint">Kamera belum aktif</div><div id="countdown"></div></div><div class="settings"><label>COUNTDOWN<select id="timer"><option value="3">3 detik</option><option value="5" selected>5 detik</option><option value="10">10 detik</option></select></label><label>JUMLAH FOTO<select id="photoCount"><option value="3" selected>3 foto</option><option value="4">4 foto</option></select></label></div><div class="actions"><button class="dark" id="capture" disabled>AMBIL FOTO</button><button id="switchCamera" disabled aria-label="Ganti kamera">↻</button></div><div id="status">Siap berfoto</div><div id="result"><canvas id="strip" width="800" height="1800"></canvas><div class="resultActions"><button class="primary" id="save">SIMPAN</button><button class="dark" id="print">CETAK</button><button id="retake">ULANGI</button></div></div></main><script src="app.js"></script></body></html>
